name: Build & Release Twrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标架构 (Target)'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
  push:
    branches:
      - main
    paths:
      - 'devices/**'
      - 'build.sh'
      - '.github/workflows/build-twrt.yml'
  schedule:
    # 每周一凌晨 04:00 (北京时间 UTC+8) 自动拉取最新上游源码与插件编译并发布新版本
    - cron: '0 20 * * 0'

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Twrt (${{ inputs.target || 'x86_64' }})

    steps:
      - name: Checkout Twrt Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Build Version
        id: version
        run: |
          echo "TAG_VERSION=v$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "TARGET=${{ inputs.target || 'x86_64' }}" >> $GITHUB_ENV

      - name: Free Disk Space
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Clone & Prepare OpenWrt Source
        run: |
          chmod +x ./build.sh
          TARGET="${{ env.TARGET }}" ./build.sh clone
          TARGET="${{ env.TARGET }}" ./build.sh prepare

      - name: Toolchain & Staging Cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: 'false'
          mixkey: ${{ env.TARGET }}
          prefix: ${{ github.workspace }}/openwrt

      - name: Compile Twrt Firmware
        run: |
          TARGET="${{ env.TARGET }}" ./build.sh compile

      - name: Organize Release Files
        run: |
          mkdir -p release_files
          cp -f openwrt/bin/targets/*/*/*.img.gz release_files/ 2>/dev/null || true
          cp -f openwrt/bin/targets/*/*/*rootfs.tar.gz release_files/ 2>/dev/null || true
          cp -f openwrt/bin/targets/*/*/sha256sums release_files/ 2>/dev/null || true
          cp -f openwrt/bin/targets/*/*/profiles.json release_files/ 2>/dev/null || true
          cp -f openwrt/.config release_files/${{ env.TARGET }}.config 2>/dev/null || true
          ls -lh release_files/

          cat > release_notes.md <<EOF
          ### Twrt ${{ env.TAG_VERSION }} (${{ env.TARGET }})
          - **编译时间**：${{ env.BUILD_DATE }} (CST)
          - **上游基线**：OpenWrt \`openwrt-25.12\` (Linux 6.12 LTS)
          - **默认管理地址**：\`10.0.0.1\`（用户名 \`root\`，默认密码 \`root\`）
          - **在线升级命令**：在路由器终端执行 \`twrt-upgrade\` 或在本地执行 \`./build.sh ota 10.0.0.1\`
          EOF

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twrt-${{ env.TARGET }}-${{ env.TAG_VERSION }}
          path: release_files/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_VERSION }}
          name: "Twrt ${{ env.TAG_VERSION }} (${{ env.TARGET }})"
          body_path: release_notes.md
          files: release_files/*
          prerelease: false
          make_latest: true

      - name: Clean Up Old Releases (Keep Latest 10)
        uses: dev-drprasad/delete-older-releases@master
        continue-on-error: true
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
